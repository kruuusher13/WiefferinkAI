# BMAD Configuration for GarageAI
# This file configures the BMAD multi-agent workflow system

# Project Information
project_name: "GarageAI"
project_description: "Voice-enabled customer service assistant for Dutch automotive garages"
version: "2.0.0"

# User Configuration
user_name: "Developer"
user_skill_level: "intermediate"  # beginner, intermediate, advanced

# Language Settings
communication_language: "English"      # Language for agent communication
document_output_language: "English"    # Language for generated documents
code_comments_language: "English"      # Language for code comments

# Output Configuration
output_folder: "{project-root}/_bmad/_output"

# Project Context
tech_stack:
  backend:
    - "Python 3.12"
    - "FastAPI"
    - "LangGraph"
    - "LangChain"
  ai:
    - "Google Gemini 2.0 Flash"
    - "Gemini Live API"
  database:
    - "SQL Server (Azure SQL Edge)"
    - "pyodbc"
  telephony:
    - "Twilio"
    - "WebSockets"
  frontend:
    - "HTML/CSS/JavaScript"
    - "WebAudio API"

# Key Directories
directories:
  source_code: "app/, bridge/"
  frontend: "web_test/"
  tests: "tests/"
  docs: "docs/"
  deployment: "deployment/"

# Domain Context (for agents)
domain:
  industry: "Automotive"
  locale: "Netherlands (Dutch)"
  primary_users: "Garage customers, garage staff"
  key_features:
    - "Voice AI assistant (Harry persona)"
    - "Real-time phone conversations via Twilio"
    - "WinCar DMS database integration"
    - "Appointment scheduling"
    - "Parts inventory lookup"
    - "Work order status checking"

# Agent Behavior
agent_settings:
  max_response_sentences: 2
  default_language: "Dutch"  # For customer-facing responses
  safety_rules:
    - "Detect emergencies (burning smell, brake failure)"
    - "Never give medical/legal advice"
    - "Escalate to human for complex issues"

# Workflow Settings
workflows:
  project_health:
    name: "Project Health & Release"
    description: "Test, document, optimize, and push changes in parallel"
    icon: "🚀"
    version: "1.0.0"
    parallel_mode: true
    timeout_minutes: 15
    approval_required_for_push: true
    agents:
      - tessa      # Testing
      - willem     # Documentation
      - sophie     # Optimization
      - barry      # Git Push
    skill_command: "project-health"
    enabled: true
