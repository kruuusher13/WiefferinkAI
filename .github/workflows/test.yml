name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: GarageAI123!
          ACCEPT_EULA: Y
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P GarageAI123! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1433:1433

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Wait for SQL Server to be ready
      run: |
        for i in {1..30}; do
          python -c "import pyodbc; pyodbc.connect('Driver={ODBC Driver 18 for SQL Server};Server=localhost;UID=sa;PWD=GarageAI123!;TrustServerCertificate=yes')" && echo "SQL Server ready!" && break
          echo "Waiting for SQL Server... ($i/30)"
          sleep 2
        done

    - name: Initialize database
      env:
        DB_SERVER: localhost
        DB_USER: sa
        DB_PASSWORD: GarageAI123!
      run: |
        python app/init_db.py

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        DB_SERVER: localhost
        DB_USER: sa
        DB_PASSWORD: GarageAI123!
      run: |
        pytest tests/ -v --tb=short --cov=app --cov=bridge --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint flake8 mypy

    - name: Check formatting with black
      run: black --check app/ bridge/ tests/

    - name: Lint with pylint
      run: |
        pylint app/ bridge/ --max-line-length=120 --disable=C0111,C0103 || true

    - name: Lint with flake8
      run: |
        flake8 app/ bridge/ --max-line-length=120 --ignore=E501,W503 || true

    - name: Type check with mypy
      run: |
        mypy app/ bridge/ --ignore-missing-imports || true
