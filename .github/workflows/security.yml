name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 1 AM UTC
    - cron: '0 1 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    name: Dependency Audit

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-audit safety

    - name: Run pip-audit
      id: pip-audit
      run: |
        echo "Scanning for known vulnerabilities..."
        pip-audit --desc || true
        echo "audit_complete=true" >> $GITHUB_OUTPUT

    - name: Run safety check
      id: safety
      run: |
        echo "Checking with Safety..."
        safety check --json > /tmp/safety.json || true
        cat /tmp/safety.json | python -m json.tool 2>/dev/null || cat /tmp/safety.json
        echo "safety_complete=true" >> $GITHUB_OUTPUT

  code-scanning:
    runs-on: ubuntu-latest
    name: Code Scanning (Bandit)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Bandit
      id: bandit
      run: |
        echo "Running Bandit security scanner..."
        bandit -r app/ bridge/ -f json -o /tmp/bandit-report.json || true

        # Convert to SARIF for GitHub
        pip install bandit2sarif
        bandit2sarif /tmp/bandit-report.json -o /tmp/bandit-report.sarif || true

        # Display results
        python << 'EOF'
        import json
        try:
            with open('/tmp/bandit-report.json', 'r') as f:
                data = json.load(f)
                if data.get('results'):
                    print(f"Found {len(data['results'])} security issues:")
                    for result in data['results']:
                        print(f"\n{result['test_id']}: {result['issue_severity']}")
                        print(f"  {result['issue_text']}")
                        print(f"  File: {result['filename']}:{result['line_number']}")
                else:
                    print("✅ No security issues found")
        except:
            print("Could not parse bandit results")
        EOF

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: /tmp/bandit-report.sarif
        category: bandit

  container-scan:
    runs-on: ubuntu-latest
    name: Container Image Scan

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t garageai:latest .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'garageai:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: trivy-results.sarif
        category: trivy

  secrets:
    runs-on: ubuntu-latest
    name: Secrets Detection

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog secret scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug --only-verified

  license-check:
    runs-on: ubuntu-latest
    name: License Compliance

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install license checker
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-licenses

    - name: Check licenses
      run: |
        echo "Checking dependencies for license compatibility..."
        pip-licenses --format=markdown --with-urls > /tmp/licenses.md

        echo "# License Report"
        echo ""
        cat /tmp/licenses.md

        # Check for problematic licenses
        if grep -i "GPL\|AGPL" /tmp/licenses.md; then
          echo "⚠️  Found GPL/AGPL licensed packages"
          echo "Review licenses before commercial use"
        else
          echo "✅ No known problematic licenses detected"
        fi

  sast:
    runs-on: ubuntu-latest
    name: SAST Analysis

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install semgrep
      run: |
        python -m pip install semgrep

    - name: Run Semgrep
      run: |
        echo "Running Semgrep SAST analysis..."
        semgrep --config=p/security-audit --config=p/python --json --output=/tmp/semgrep.json app/ bridge/ || true

        # Display results
        python << 'EOF'
        import json
        try:
            with open('/tmp/semgrep.json', 'r') as f:
                data = json.load(f)
                if data.get('results'):
                    print(f"Found {len(data['results'])} issues:")
                    for result in data['results']:
                        print(f"\n{result['rule_id']}: {result['check_id']}")
                        print(f"  {result['message']}")
                else:
                    print("✅ No issues found")
        except Exception as e:
            print(f"Could not parse results: {e}")
        EOF

  summary:
    runs-on: ubuntu-latest
    name: Security Summary
    needs: [dependencies, code-scanning, container-scan, secrets, license-check, sast]
    if: always()

    steps:
    - name: Generate Security Report
      run: |
        cat > /tmp/security-report.md << 'EOF'
        # 🔒 Security Scan Summary

        **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
        **Commit**: ${{ github.sha }}

        ## Results

        | Scanner | Status | Details |
        |---------|--------|---------|
        | pip-audit | ${{ needs.dependencies.result == 'success' && '✅' || '⚠️' }} | Python dependency audit |
        | Bandit | ${{ needs.code-scanning.result == 'success' && '✅' || '⚠️' }} | Code security issues |
        | Trivy | ${{ needs.container-scan.result == 'success' && '✅' || '⚠️' }} | Container image scan |
        | TruffleHog | ${{ needs.secrets.result == 'success' && '✅' || '⚠️' }} | Secrets detection |
        | License Check | ${{ needs.license-check.result == 'success' && '✅' || '⚠️' }} | License compliance |
        | Semgrep | ${{ needs.sast.result == 'success' && '✅' || '⚠️' }} | SAST analysis |

        ## Action Required

        - [ ] Review any critical findings above
        - [ ] Update dependencies if vulnerabilities found
        - [ ] Fix code security issues in Bandit report
        - [ ] Verify no secrets were committed

        ## Next Steps

        See GitHub Security tab for detailed reports.

        EOF

        cat /tmp/security-report.md

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🔒 Security Scanning Complete\n\nAll security scans completed. See the [Security tab](${context.payload.pull_request.html_url.replace('/pull/', '/security/code-scanning')}) for detailed results.`
          });

    - name: Slack notification
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "⚠️ Security Issues Found",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*⚠️ Security Issues Found*\n\nSecurity scanning detected potential issues. Review the <${{ github.server_url }}/${{ github.repository }}/security/code-scanning|Security tab> for details."
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
